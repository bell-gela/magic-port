const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const colors={kids:'#9adabc',sat:'#a5b8f5',sports:'#92dbe8',maker:'#ffe1a6',seminar:'#bcb0ed',stage:'#f6bbd5',food:'#ffb7ab'};
const keys=['kids','sat','sports','maker','seminar','food','stage'];
let zone='all',q='',day='24',savedOnly=false,activeItem=null,visibleCount=16,zoom=1,mx=0,my=0,detailMap=false,makerGroup='A',mapHighlight=null;
let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem('fes-map-v2-saved')||'[]'))}catch(e){}
function persist(){try{localStorage.setItem('fes-map-v2-saved',JSON.stringify(Array.from(fav)))}catch(e){}}
function safe(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
const norm=s=>String(s??'').normalize('NFKC').toLowerCase();
function getItems(){return items.filter(x=>(x.day==='both'||x.day===day)&&(!savedOnly||fav.has(x.id))&&(zone==='all'||x.zone===zone)&&(!q||norm([x.title,x.code,x.desc,x.meta,x.alias,zoneInfo[x.zone].name].join(' ')).includes(norm(q))))}

function codeLabel(x){if(x.zone==='food')return '屋外'+x.code.replace(/\D/g,'');if(x.zone==='seminar')return x.title.replace('セミナー','');if(x.zone==='stage')return 'LIVE';return x.code}
function renderBooth(){
 const box=$('#booth-view'),vp=$('#viewport');
 vp.classList.toggle('detail-mode',detailMap && zone!=='all');
 if(!detailMap||zone==='all'){box.innerHTML='';return}
 const z=zoneInfo[zone];
 const available=items.filter(x=>x.zone===zone&&(x.day==='both'||x.day===day));
 const data=zone==='maker'?available.filter(x=>x.code.startsWith(makerGroup)):available;
 const groups=zone==='maker'?'<div class="bv-tabs">'+Object.keys(makerMeta).map(k=>'<button type="button" data-group="'+k+'" class="bv-tab '+(k===makerGroup?'selected':'')+'">'+k+' '+safe(makerMeta[k])+'</button>').join('')+'</div>':'';
 box.innerHTML='<div class="bv-top"><button type="button" class="bv-back" id="bv-back" aria-label="全体図に戻る">←</button><div><div class="bv-label">BOOTH EXPLORER / 2026</div><div class="bv-title">'+safe(z.short)+'　<small style="font-size:12px;color:#869aab">ブース詳細</small></div></div><div class="bv-count">'+data.length+'ブース</div></div>'+groups+'<div class="bv-cards">'+(data.map(x=>'<button type="button" class="bv-card '+(x.id===mapHighlight?'current':'')+'" style="--zc:'+colors[zone]+'" data-booth="'+safe(x.id)+'" aria-label="'+safe(x.code+' '+x.title)+'"><span class="bv-id">'+safe(codeLabel(x))+'</span><span class="bv-name">'+safe(x.title)+'</span>'+(fav.has(x.id)?'<span class="bv-heart">♥</span>':'')+'</button>').join('')||'<div class="bv-empty">該当するブースがありません</div>')+'</div><div class="bv-foot">番号で探せます。並び順は実際の配置を表すものではありません。</div>';
 $('#bv-back').addEventListener('click',()=>{detailMap=false;zone='all';mapHighlight=null;render()});
 box.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{makerGroup=b.dataset.group;mapHighlight=null;render()}));
 box.querySelectorAll('[data-booth]').forEach(b=>b.addEventListener('click',()=>{mapHighlight=b.dataset.booth;renderBooth();detail(b.dataset.booth)}));
}
function drill(k,highlight=null){
 zone=k;q='';savedOnly=false;visibleCount=16;makerGroup=(highlight&&/^[A-F]/.test(highlight))?highlight[0]:'A';mapHighlight=highlight;detailMap=k!=='all';$('#search').value='';render();
 if(window.innerWidth<850){document.querySelector('.map-section').scrollIntoView({behavior:'smooth',block:'start'})}
}

function render(){const arr=getItems();const desc=zone==='all'?'ブースを探す':zoneInfo[zone].short;$('#section-title').textContent=savedOnly?'行きたいリスト':q?'検索結果':desc;$('#section-type').textContent=savedOnly?'SAVED':q?'SEARCH RESULTS':'EXPLORE';$('#count').textContent=arr.length+'件';$('#saved-num').textContent=fav.size;$('#saved-toggle').classList.toggle('active',savedOnly);$('#saved-toggle').querySelector('span').textContent=savedOnly?'♥':'♡';$('#clear').style.display=q?'block':'none';$('#day24').classList.toggle('active',day==='24');$('#day25').classList.toggle('active',day==='25');$('#map-hint').textContent=zone==='all'?'エリアをタップ': '← 全体図に戻る';
 $('#pills').innerHTML='<button type="button" class="pill '+(zone==='all'?'active':'')+'" data-filter="all">すべて</button>'+keys.map(k=>'<button type="button" class="pill '+(zone===k?'active':'')+'" data-filter="'+k+'"><span class="dot" style="background:'+colors[k]+'"></span>'+zoneInfo[k].short+'</button>').join('');
 $$('.hot').forEach(g=>{g.classList.toggle('selected',zone===g.dataset.zone);g.classList.toggle('dim',zone!=='all'&&zone!==g.dataset.zone)});
 $('#res-list').innerHTML=arr.length?arr.slice(0,visibleCount).map(x=>'<div class="result" data-open="'+safe(x.id)+'" role="button" tabindex="0" aria-label="'+safe(x.title)+'の詳細"><div class="code" style="background:'+colors[x.zone]+'">'+safe(x.code.replace('FOOD-','F').replace('SEM-','S').replace('ST-','T'))+'</div><div class="result-body"><div class="result-name">'+safe(x.title)+'</div><div class="result-meta">'+safe(zoneInfo[x.zone].short)+(x.meta?' · '+safe(x.meta):'')+'</div></div><button type="button" class="fav '+(fav.has(x.id)?'on':'')+'" data-save="'+safe(x.id)+'" aria-label="'+(fav.has(x.id)?'お気に入りから削除':'お気に入りに追加')+'">'+(fav.has(x.id)?'♥':'♡')+'</button></div>').join('')+(arr.length>visibleCount?'<button type="button" class="more" id="more">もっと見る（あと'+(arr.length-visibleCount)+'件） ↓</button>':''):'<div class="empty"><strong>'+(savedOnly?'まだ保存したブースがありません':'該当するブースがありません')+'</strong>'+(savedOnly?'♡を押すとここに表示されます':'別のキーワードを試してみてね')+'</div>';
 $('#pills').querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>drill(btn.dataset.filter)));
 $('#res-list').querySelectorAll('[data-save]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();toggle(btn.dataset.save)}));
 $('#res-list').querySelectorAll('[data-open]').forEach(row=>{row.addEventListener('click',e=>{if(!e.target.closest('[data-save]'))detail(row.dataset.open)});row.addEventListener('keydown',e=>{if(e.key==='Enter')detail(row.dataset.open)})});
 $('#more')?.addEventListener('click',()=>{visibleCount+=24;render()});renderBooth()}
function toggle(id){fav.has(id)?fav.delete(id):fav.add(id);persist();render();if(activeItem===id){$('#detail-save').textContent=fav.has(id)?'♥ 保存済み':'♡ 行きたい'}}
function choose(k){drill(k)}
$$('.hot').forEach(g=>{g.addEventListener('click',()=>{if(!moved)choose(g.dataset.zone)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(g.dataset.zone)}})});
function detail(id){const x=items.find(v=>v.id===id);if(!x)return;activeItem=id;const z=zoneInfo[x.zone];$('#detail-code').textContent=x.code;$('#detail-code').style.background=colors[x.zone];$('#detail-zone').textContent=z.name;$('#detail-title').textContent=x.title;$('#detail-desc').textContent=x.desc||z.desc;$('#detail-extra').textContent=[x.meta,x.day!=='both'?'10月'+x.day+'日のみ':''].filter(Boolean).join(' · ');$('#detail-official').href=z.url;$('#detail-save').textContent=fav.has(id)?'♥ 保存済み':'♡ 行きたい';$('#overlay').classList.add('open');$('#overlay').setAttribute('aria-hidden','false')}
function close(){activeItem=null;$('#overlay').classList.remove('open');$('#overlay').setAttribute('aria-hidden','true')}
$('#modal-close').addEventListener('click',close);$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#detail-save').addEventListener('click',()=>{if(activeItem)toggle(activeItem)});$('#detail-locate').addEventListener('click',()=>{const x=items.find(v=>v.id===activeItem);if(x){close();drill(x.zone,x.id)}});
$('#search').addEventListener('input',e=>{q=e.target.value.trim();zone='all';detailMap=false;savedOnly=false;visibleCount=16;render()});$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#results').scrollIntoView({behavior:'smooth',block:'start'});e.target.blur()}});$('#clear').addEventListener('click',()=>{q='';$('#search').value='';detailMap=false;render();$('#search').focus()});$('#saved-toggle').addEventListener('click',()=>{savedOnly=!savedOnly;q='';zone='all';detailMap=false;visibleCount=16;$('#search').value='';render();if(savedOnly&&window.innerWidth<850)$('#results').scrollIntoView({behavior:'smooth',block:'start'})});$('#day24').addEventListener('click',()=>{day='24';render()});$('#day25').addEventListener('click',()=>{day='25';render()});
function transform(){zoom=Math.max(1,Math.min(3.6,zoom));if(zoom===1){mx=0;my=0}else{const b=$('#viewport').getBoundingClientRect();mx=Math.max(-b.width*(zoom-1)/2,Math.min(b.width*(zoom-1)/2,mx));my=Math.max(-b.height*(zoom-1)/2,Math.min(b.height*(zoom-1)/2,my))}$('#world').style.transform='translate('+mx+'px,'+my+'px) scale('+zoom+')'}
$('#zoom-in').addEventListener('click',()=>{zoom*=1.33;transform()});$('#zoom-out').addEventListener('click',()=>{zoom/=1.33;transform()});$('#zoom-reset').addEventListener('click',()=>{zoom=1;transform()});
const pointers=new Map();let lastDistance=0,moved=false,downX=0,downY=0;const vp=$('#viewport');vp.addEventListener('pointerdown',e=>{if(e.target.closest('.map-tools'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});downX=e.clientX;downY=e.clientY;moved=false;if(pointers.size===2){const p=[...pointers.values()];lastDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(lastDistance){zoom*=d/lastDistance;transform()}lastDistance=d;moved=true}else if(zoom>1){const dx=e.clientX-old.x,dy=e.clientY-old.y;mx+=dx;my+=dy;transform();if(Math.hypot(e.clientX-downX,e.clientY-downY)>4)moved=true}});
function pointerEnd(e){pointers.delete(e.pointerId);if(pointers.size<2)lastDistance=0}vp.addEventListener('pointerup',pointerEnd);vp.addEventListener('pointercancel',pointerEnd);vp.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.12:1/1.12;transform()},{passive:false});
render();transform();
})();
